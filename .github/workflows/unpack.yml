
name: Extract RU iOS Store

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - name: Get repository
        uses: actions/checkout@v4

      - name: Extract project
        run: |
          unzip -o RU_iOS_Store_starter.zip -d .
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.py bot.py requirements.txt README.md .env.example static/
          git commit -m "Extract RU iOS Store project" || true
          git push
