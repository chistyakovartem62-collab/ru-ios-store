<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Delete Store — Приложения, коды и подписки</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root {
            --bg-color: #0f0b10;
            --card-bg: #1c131d;
            --card-border: rgba(255, 68, 102, 0.15);
            --accent-color: #ff2d55;
            --accent-gradient: linear-gradient(135deg, #ff2d55 0%, #b31432 100%);
            --text-main: #ffffff;
            --text-secondary: #9c919d;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            padding-bottom: 110px;
        }

        .header-banner {
            background: linear-gradient(180deg, #2a1520 0%, var(--bg-color) 100%);
            padding: 20px 16px 15px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
        }

        .promo-card {
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 16px;
            padding: 14px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 14px;
        }

        .promo-info h2 {
            font-size: 15px;
            font-weight: 600;
            margin-bottom: 3px;
        }

        .promo-info p {
            font-size: 12px;
            color: var(--text-secondary);
        }

        .promo-badge {
            background: var(--accent-gradient);
            color: white;
            font-weight: 700;
            font-size: 14px;
            padding: 6px 10px;
            border-radius: 10px;
        }

        .search-box {
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 14px;
            padding: 12px 16px;
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 14px;
        }

        .search-box input {
            background: none;
            border: none;
            color: var(--text-main);
            font-size: 14px;
            width: 100%;
            outline: none;
        }

        .search-box input::placeholder {
            color: var(--text-secondary);
        }

        .categories {
            display: flex;
            gap: 8px;
            overflow-x: auto;
            padding-bottom: 4px;
            scrollbar-width: none;
        }

        .categories::-webkit-scrollbar {
            display: none;
        }

        .cat-btn {
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            color: var(--text-secondary);
            padding: 8px 16px;
            border-radius: 20px;
            font-size: 13px;
            font-weight: 500;
            white-space: nowrap;
            cursor: pointer;
            transition: 0.2s;
        }

        .cat-btn.active {
            background: var(--text-main);
            color: var(--bg-color);
            border-color: var(--text-main);
        }

        .container {
            padding: 16px;
        }

        .apps-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 16px 12px;
        }

        .app-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            cursor: pointer;
            position: relative;
        }

        .app-icon {
            width: 64px;
            height: 64px;
            border-radius: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 22px;
            font-weight: 700;
            color: white;
            margin-bottom: 6px;
            box-shadow: inset 0 1px 0 rgba(255,255,255,0.2), 0 4px 12px rgba(0,0,0,0.3);
            position: relative;
            overflow: hidden;
        }

        .app-icon svg {
            width: 32px;
            height: 32px;
            fill: currentColor;
        }

        .app-name {
            font-size: 12px;
            text-align: center;
            color: var(--text-main);
            line-height: 1.2;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        .app-item.selected .app-icon::after {
            content: '✓';
            position: absolute;
            top: 4px;
            right: 4px;
            background: var(--accent-color);
            color: white;
            width: 20px;
            height: 20px;
            border-radius: 50%;
            font-size: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            box-shadow: 0 2px 5px rgba(0,0,0,0.3);
        }

        .cart-bar {
            position: fixed;
            bottom: 75px;
            left: 16px;
            right: 16px;
            background: #251823;
            border: 1px solid rgba(255, 45, 85, 0.3);
            border-radius: 18px;
            padding: 14px 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            backdrop-filter: blur(10px);
            transform: translateY(150px);
            transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            z-index: 100;
        }

        .cart-bar.visible {
            transform: translateY(0);
        }

        .cart-info {
            display: flex;
            flex-direction: column;
        }

        .cart-count {
            font-size: 12px;
            color: var(--text-secondary);
        }

        .cart-price {
            font-size: 18px;
            font-weight: 700;
            color: var(--text-main);
        }

        .buy-btn {
            background: var(--accent-gradient);
            color: white;
            border: none;
            padding: 12px 28px;
            border-radius: 12px;
            font-size: 15px;
            font-weight: 700;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(255, 45, 85, 0.4);
        }

        .nav-bar {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background: rgba(15, 11, 16, 0.95);
            backdrop-filter: blur(20px);
            border-top: 1px solid rgba(255, 255, 255, 0.05);
            display: flex;
            justify-content: space-around;
            padding: 10px 0 25px;
            z-index: 101;
        }

        .nav-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            color: var(--text-secondary);
            font-size: 11px;
            cursor: pointer;
            gap: 4px;
            background: none;
            border: none;
        }

        .nav-item.active {
            color: var(--accent-color);
        }

        .nav-item svg {
            width: 22px;
            height: 22px;
            fill: currentColor;
        }
    </style>
</head>
<body>

    <div class="header-banner">
        <div class="promo-card">
            <div class="promo-info">
                <h2>🔥 Скидка до 30% на приложения</h2>
                <p>Чем больше приложений — тем выше скидка</p>
            </div>
            <div class="promo-badge">D5</div>
        </div>

        <div class="search-box">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="color: var(--text-secondary);"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
            <input type="text" id="searchInput" placeholder="Поиск приложений..." oninput="filterApps()">
        </div>

        <div class="categories" id="categories">
            <button class="cat-btn active" onclick="setCategory('all', this)">Все</button>
            <button class="cat-btn" onclick="setCategory('banks', this)">Банки</button>
            <button class="cat-btn" onclick="setCategory('social', this)">Общение</button>
            <button class="cat-btn" onclick="setCategory('ai', this)">AI</button>
            <button class="cat-btn" onclick="setCategory('services', this)">Сервисы</button>
        </div>
    </div>

    <div class="container">
        <div class="apps-grid" id="appsGrid"></div>
    </div>

    <div class="cart-bar" id="cartBar">
        <div class="cart-info">
            <span class="cart-count" id="cartCount">1 приложение</span>
            <span class="cart-price" id="cartTotalPrice">790 ₽</span>
        </div>
        <button class="buy-btn" onclick="checkout()">Купить</button>
    </div>

    <nav class="nav-bar">
        <button class="nav-item active">
            <svg viewBox="0 0 24 24"><path d="M4 8h4V4H4v4zm6 12h4v-4h-4v4zm-6 0h4v-4H4v4zm0-6h4v-4H4v4zm6 0h4v-4h-4v4zm6-10v4h4V4h-4zm-6 4h4V4h-4v4zm6 6h4v-4h-4v4zm0 6h4v-4h-4v4z"/></svg>
            Приложения
        </button>
        <button class="nav-item" onclick="alert('Раздел товаров в разработке')">
            <svg viewBox="0 0 24 24"><path d="M21 4H3c-1.1 0-2 .9-2 2v12c0 1.1.9 2 2 2h18c1.1 0 2-.9 2-2V6c0-1.1-.9-2-2-2zm0 14H3V8h18v10z"/></svg>
            Товары
        </button>
        <button class="nav-item" onclick="alert('История заказов пуста')">
            <svg viewBox="0 0 24 24"><path d="M14 2H6c-1.1 0-1.99.9-1.99 2L4 20c0 1.1.89 2 1.99 2H18c1.1 0 2-.9 2-2V8l-6-6zm2 16H8v-2h8v2zm0-4H8v-2h8v2zm-3-5V3.5L18.5 9H13z"/></svg>
            Заказы
        </button>
        <button class="nav-item" onclick="alert('Личный кабинет')">
            <svg viewBox="0 0 24 24"><path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/></svg>
            Профиль
        </button>
    </nav>

    <script>
        const apps = [
            { id: 1, name: "Сбербанк", cat: "banks", bg: "linear-gradient(135deg, #00A651 0%, #007A3D 100%)", text: "СБ", price: 790 },
            { id: 2, name: "Т-Банк", cat: "banks", bg: "linear-gradient(135deg, #FFDD00 0%, #E5C400 100%)", text: "Т", price: 790 },
            { id: 3, name: "Альфа-Банк", cat: "banks", bg: "linear-gradient(135deg, #EF3124 0%, #B81D12 100%)", text: "А", price: 790 },
            { id: 4, name: "ВТБ", cat: "banks", bg: "linear-gradient(135deg, #002D72 0%, #001A44 100%)", text: "ВТБ", price: 790 },
            { id: 5, name: "Авито", cat: "services", bg: "linear-gradient(135deg, #00AAFF 0%, #0077B6 100%)", text: "A", price: 790 },
            { id: 6, name: "Вконтакте", cat: "social", bg: "linear-gradient(135deg, #0077FF 0%, #0051CC 100%)", text: "VK", price: 790 },
            { id: 7, name: "ВК Мессенджер", cat: "social", bg: "linear-gradient(135deg, #2688EB 0%, #175DA3 100%)", text: "💬", price: 790 },
            { id: 8, name: "ВК Музыка", cat: "services", bg: "linear-gradient(135deg, #FF334B 0%, #CC1129 100%)", text: "🎵", price: 790 },
            { id: 9, name: "Окко", cat: "services", bg: "linear-gradient(135deg, #2C2C2E 0%, #1C1C1E 100%)", text: "Okko", price: 790 },
            { id: 10, name: "РЖД Пассажирам", cat: "services", bg: "linear-gradient(135deg, #003399 0%, #001F60 100%)", text: "РЖД", price: 790 },
            { id: 11, name: "ChatGPT", cat: "ai", bg: "linear-gradient(135deg, #10A37F 0%, #0D8264 100%)", text: "AI", price: 790 },
            { id: 12, name: "Claude AI", cat: "ai", bg: "linear-gradient(135deg, #CC785C 0%, #9E5842 100%)", text: "Cl", price: 790 },
            { id: 13, name: "DeepSeek", cat: "ai", bg: "linear-gradient(135deg, #4E6EF2 0%, #324CB5 100%)", text: "DS", price: 790 },
            { id: 14, name: "Perplexity", cat: "ai", bg: "linear-gradient(135deg, #20B2AA55 0%, #12807A 100%)", text: "Px", price: 790 },
            { id: 15, name: "Happ Plus", cat: "services", bg: "linear-gradient(135deg, #FF9500 0%, #C67300 100%)", text: "⚡", price: 790 },
            { id: 16, name: "v2RayTun", cat: "services", bg: "linear-gradient(135deg, #5856D6 0%, #3A389B 100%)", text: "VPN", price: 790 }
        ];

        let selectedCategory = 'all';
        let selectedApps = new Set([1]);

        function renderApps(filterText = '') {
            const grid = document.getElementById('appsGrid');
            grid.innerHTML = '';

            const filtered = apps.filter(app => {
                const matchesCat = selectedCategory === 'all' || app.cat === selectedCategory;
                const matchesSearch = app.name.toLowerCase().includes(filterText.toLowerCase());
                return matchesCat && matchesSearch;
            });

            filtered.forEach(app => {
                const isSelected = selectedApps.has(app.id);
                const item = document.createElement('div');
                item.className = `app-item ${isSelected ? 'selected' : ''}`;
                item.onclick = () => toggleApp(app.id);
                
                item.innerHTML = `
                    <div class="app-icon" style="background: ${app.bg}">${app.text}</div>
                    <div class="app-name">${app.name}</div>
                `;
                grid.appendChild(item);
            });

            updateCartBar();
        }

        function toggleApp(id) {
            if (selectedApps.has(id)) {
                if (selectedApps.size > 1) selectedApps.delete(id);
            } else {
                selectedApps.add(id);
            }
            renderApps(document.getElementById('searchInput').value);
        }

        function setCategory(cat, el) {
            selectedCategory = cat;
            document.querySelectorAll('.cat-btn').forEach(btn => btn.classList.remove('active'));
            el.classList.add('active');
            renderApps(document.getElementById('searchInput').value);
        }

        function filterApps() {
            renderApps(document.getElementById('searchInput').value);
        }

        function updateCartBar() {
            const cartBar = document.getElementById('cartBar');
            const countEl = document.getElementById('cartCount');
            const priceEl = document.getElementById('cartTotalPrice');

            if (selectedApps.size > 0) {
                cartBar.classList.add('visible');
                const count = selectedApps.size;
                countEl.innerText = `${count} ${getDeclension(count, ['приложение', 'приложения', 'приложений'])}`;
                priceEl.innerText = `${count * 790} ₽`;
            } else {
                cartBar.classList.remove('visible');
            }
        }

        function getDeclension(number, titles) {
            const cases = [2, 0, 1, 1, 1, 2];
            return titles[(number % 100 > 4 && number % 100 < 20) ? 2 : cases[(number % 10 < 5) ? number % 10 : 5]];
        }

        function checkout() {
            alert(`Переход к оплате заказа на сумму: ${selectedApps.size * 790} ₽`);
        }

        renderApps();
    </script>
</body>
</html>
