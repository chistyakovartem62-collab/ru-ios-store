<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>RU iOS Store</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root {
            --bg-color: var(--tg-theme-bg-color, #ffffff);
            --secondary-bg: var(--tg-theme-secondary-bg-color, #f2f2f7);
            --text-color: var(--tg-theme-text-color, #000000);
            --hint-color: var(--tg-theme-hint-color, #8e8e93);
            --accent-color: #007aff;
            --border-color: rgba(142, 142, 147, 0.2);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', Roboto, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            padding-bottom: 40px;
        }

        .header {
            padding: 16px 16px 8px;
        }

        .subtitle {
            font-size: 13px;
            font-weight: 600;
            color: var(--hint-color);
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .title {
            font-size: 32px;
            font-weight: 800;
            letter-spacing: -0.5px;
            margin-top: 2px;
        }

        .search-container {
            padding: 8px 16px 12px;
            position: sticky;
            top: 0;
            background-color: var(--bg-color);
            z-index: 10;
        }

        .search-input {
            width: 100%;
            background-color: var(--secondary-bg);
            border: none;
            border-radius: 10px;
            padding: 10px 14px;
            font-size: 16px;
            color: var(--text-color);
            outline: none;
        }

        .search-input::placeholder {
            color: var(--hint-color);
        }

        .categories {
            display: flex;
            gap: 8px;
            overflow-x: auto;
            padding: 4px 16px 16px;
            scrollbar-width: none;
        }
        .categories::-webkit-scrollbar { display: none; }

        .cat-chip {
            background-color: var(--secondary-bg);
            color: var(--text-color);
            padding: 7px 14px;
            border-radius: 20px;
            font-size: 14px;
            font-weight: 600;
            white-space: nowrap;
            cursor: pointer;
            transition: 0.2s;
        }

        .cat-chip.active {
            background-color: var(--accent-color);
            color: #ffffff;
        }

        .section-title {
            font-size: 20px;
            font-weight: 700;
            padding: 0 16px 12px;
        }

        .app-list {
            padding: 0 16px;
            display: flex;
            flex-direction: column;
            gap: 14px;
        }

        .app-card {
            display: flex;
            align-items: center;
            gap: 14px;
            padding-bottom: 14px;
            border-bottom: 1px solid var(--border-color);
            cursor: pointer;
        }

        .app-icon {
            width: 60px;
            height: 60px;
            border-radius: 14px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 28px;
            font-weight: bold;
            color: white;
            flex-shrink: 0;
        }

        .app-info {
            flex: 1;
            min-width: 0;
        }

        .app-name {
            font-size: 17px;
            font-weight: 600;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .app-desc {
            font-size: 13px;
            color: var(--hint-color);
            margin-top: 2px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .app-tag {
            display: inline-block;
            font-size: 11px;
            color: var(--accent-color);
            background: rgba(0, 122, 255, 0.12);
            padding: 2px 6px;
            border-radius: 4px;
            margin-top: 4px;
            font-weight: 500;
        }

        .get-btn {
            background-color: var(--secondary-bg);
            color: var(--accent-color);
            font-weight: 700;
            font-size: 14px;
            padding: 6px 16px;
            border-radius: 16px;
            border: none;
            cursor: pointer;
        }

        .modal-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.5);
            display: none;
            align-items: flex-end;
            z-index: 100;
        }

        .modal-overlay.open {
            display: flex;
        }

        .modal-sheet {
            background-color: var(--bg-color);
            width: 100%;
            border-radius: 20px 20px 0 0;
            padding: 20px 16px 36px;
            max-height: 85vh;
            overflow-y: auto;
            animation: slideUp 0.25s ease-out;
        }

        @keyframes slideUp {
            from { transform: translateY(100%); }
            to { transform: translateY(0); }
        }

        .modal-header {
            display: flex;
            gap: 16px;
            align-items: center;
            margin-bottom: 16px;
        }

        .modal-icon {
            width: 76px;
            height: 76px;
            border-radius: 18px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 36px;
            color: white;
            font-weight: bold;
        }

        .install-box {
            background-color: var(--secondary-bg);
            padding: 14px;
            border-radius: 12px;
            margin: 16px 0;
            font-size: 14px;
            line-height: 1.45;
        }

        .primary-action {
            width: 100%;
            background-color: var(--accent-color);
            color: white;
            border: none;
            padding: 14px;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            margin-top: 8px;
        }
    </style>
</head>
<body>

    <div class="header">
        <div class="subtitle">RU iOS Store 🇷🇺</div>
        <div class="title">Каталог</div>
    </div>

    <div class="search-container">
        <input type="text" id="searchInput" class="search-input" placeholder="Поиск приложений...">
    </div>

    <div class="categories" id="categoriesContainer">
        <div class="cat-chip active" data-cat="all">Все</div>
        <div class="cat-chip" data-cat="banks">Банки</div>
        <div class="cat-chip" data-cat="shops">Магазины</div>
        <div class="cat-chip" data-cat="telecom">Связь</div>
        <div class="cat-chip" data-cat="media">Медиа</div>
        <div class="cat-chip" data-cat="delivery">Доставка</div>
    </div>

    <div class="section-title" id="sectionTitle">Популярное</div>
    <div class="app-list" id="appList"></div>

    <div class="modal-overlay" id="modalOverlay">
        <div class="modal-sheet" id="modalSheet">
            <div class="modal-header">
                <div class="modal-icon" id="mIcon"></div>
                <div>
                    <h2 id="mName" style="font-size: 22px;"></h2>
                    <p id="mSubtitle" style="color: var(--hint-color); font-size: 14px;"></p>
                </div>
            </div>
            <p id="mDesc" style="font-size: 15px; line-height: 1.4;"></p>
            <div class="install-box">
                <strong>Способ установки:</strong>
                <p id="mInstruction" style="margin-top: 6px;"></p>
            </div>
            <button class="primary-action" id="mActionBtn">Перейти к установке</button>
            <button class="primary-action" style="background: transparent; color: var(--hint-color); margin-top: 4px;" onclick="closeModal()">Закрыть</button>
        </div>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();

        const apps = [
            {
                id: 1,
                name: "СберБанк",
                subtitle: "Финансы и платежи",
                category: "banks",
                iconText: "С",
                color: "#21A038",
                tag: "Веб-версия / PWA",
                desc: "Официальный онлайн-банк для управления счетами, переводами и оплатой услуг.",
                instruction: "1. Нажмите кнопку ниже, чтобы открыть официальный сайт СберБанк Онлайн в Safari.\n2. Нажмите «Поделиться» (квадрат со стрелкой вверх) → «На экран „Домой“».",
                url: "https://online.sberbank.ru"
            },
            {
                id: 2,
                name: "Т-Банк",
                subtitle: "Банк и инвестиции",
                category: "banks",
                iconText: "Т",
                color: "#FFDD2D",
                textColor: "#000",
                tag: "Веб-приложение",
                desc: "Удобный мобильный банк, кэшбэк, переводы без комиссии и управление картами.",
                instruction: "Откройте личный кабинет через браузер Safari и добавьте ярлык на рабочий стол iPhone.",
                url: "https://www.tbank.ru"
            },
            {
                id: 3,
                name: "Ozon",
                subtitle: "Маркетплейс",
                category: "shops",
                iconText: "O",
                color: "#005BFF",
                tag: "Доступно в App Store",
                desc: "Миллионы товаров с быстрой доставкой в пункты выдачи и курьером.",
                instruction: "Приложение официально доступно в российском App Store. Нажмите кнопку для перехода.",
                url: "https://apps.apple.com"
            },
            {
                id: 4,
                name: "Яндекс Еда",
                subtitle: "Доставка из ресторанов",
                category: "delivery",
                iconText: "Е",
                color: "#FCE000",
                textColor: "#000",
                tag: "Доступно в App Store",
                desc: "Быстрая доставка еды из любимых ресторанов и продуктов из магазинов.",
                instruction: "Официальное приложение доступно для скачивания в App Store.",
                url: "https://apps.apple.com"
            }
        ];

        let currentCategory = 'all';
        let searchQuery = '';

        function renderApps() {
            const list = document.getElementById('appList');
            list.innerHTML = '';

            const filtered = apps.filter(app => {
                const matchesCat = currentCategory === 'all' || app.category === currentCategory;
                const matchesSearch = app.name.toLowerCase().includes(searchQuery.toLowerCase()) ||
                                      app.subtitle.toLowerCase().includes(searchQuery.toLowerCase());
                return matchesCat && matchesSearch;
            });

            if (filtered.length === 0) {
                list.innerHTML = '<p style="color: var(--hint-color); text-align: center; padding: 30px 0;">Ничего не найдено</p>';
                return;
            }

            filtered.forEach(app => {
                const card = document.createElement('div');
                card.className = 'app-card';
                card.innerHTML = `
                    <div class="app-icon" style="background: ${app.color}; color: ${app.textColor || '#fff'}">${app.iconText}</div>
                    <div class="app-info">
                        <div class="app-name">${app.name}</div>
                        <div class="app-desc">${app.subtitle}</div>
                        <div class="app-tag">${app.tag}</div>
                    </div>
                    <button class="get-btn">Открыть</button>
                `;
                card.onclick = () => openModal(app);
                list.appendChild(card);
            });
        }

        document.querySelectorAll('.cat-chip').forEach(chip => {
            chip.onclick = () => {
                if (tg.HapticFeedback) tg.HapticFeedback.selectionChanged();
                document.querySelectorAll('.cat-chip').forEach(c => c.classList.remove('active'));
                chip.classList.add('active');
                currentCategory = chip.dataset.cat;
                document.getElementById('sectionTitle').innerText = chip.innerText === 'Все' ? 'Популярное' : chip.innerText;
                renderApps();
            };
        });

        document.getElementById('searchInput').oninput = (e) => {
            searchQuery = e.target.value;
            renderApps();
        };

        function openModal(app) {
            if (tg.HapticFeedback) tg.HapticFeedback.impactOccurred('light');
            document.getElementById('mIcon').innerText = app.iconText;
            document.getElementById('mIcon').style.background = app.color;
            document.getElementById('mIcon').style.color = app.textColor || '#fff';
            document.getElementById('mName').innerText = app.name;
            document.getElementById('mSubtitle').innerText = app.subtitle;
            document.getElementById('mDesc').innerText = app.desc;
            document.getElementById('mInstruction').innerText = app.instruction;
            
            document.getElementById('mActionBtn').onclick = () => {
                tg.openLink(app.url);
            };

            document.getElementById('modalOverlay').classList.add('open');
        }

        function closeModal() {
            document.getElementById('modalOverlay').classList.remove('open');
        }

        document.getElementById('modalOverlay').onclick = (e) => {
            if (e.target.id === 'modalOverlay') closeModal();
        };

        renderApps();
    </script>
</body>
</html>
